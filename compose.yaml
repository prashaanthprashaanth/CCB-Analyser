name: ccb-fault-analyser

services:
  analyser:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccb-fault-analyser:local
    container_name: ccb-fault-analyser
    restart: unless-stopped
    init: true
    ports:
      - "${CCB_PORT:-8080}:8080"
    volumes:
      - ccb-data:/data
    environment:
      TZ: Asia/Kolkata
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  ccb-data:
    name: ccb-fleet-data
